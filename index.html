<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0d0620">
    <title>🌌 Эволюция Материи</title>
    <style>
        :root {
            --bg-top: #1a0b36;
            --bg-mid: #0a1128;
            --bg-bot: #04050a;
            --accent: #7c4dff;
            --accent-glow: rgba(124, 77, 255, 0.5);
            --green: #00e676;
            --green-bg: rgba(0, 230, 118, 0.12);
            --green-border: rgba(0, 230, 118, 0.5);
            --disabled-bg: rgba(255, 255, 255, 0.04);
            --disabled-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-sub: #a6b0cf;
            --danger: #ff5252;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 50%, var(--bg-bot) 100%);
            background-attachment: fixed;
            color: var(--text-main);
            font-size: 16px;
        }

        /* Звездная пыль на фоне (чистый CSS) */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.4) 0%, transparent 100%),
                radial-gradient(1.5px 1.5px at 75% 15%, rgba(255,255,255,0.3) 0%, transparent 100%),
                radial-gradient(1px 1px at 40% 70%, rgba(255,255,255,0.5) 0%, transparent 100%),
                radial-gradient(2px 2px at 85% 60%, rgba(160,180,255,0.3) 0%, transparent 100%),
                radial-gradient(1px 1px at 10% 85%, rgba(255,255,255,0.4) 0%, transparent 100%);
            pointer-events: none;
            z-index: 0;
        }

        .app-container {
            position: relative;
            z-index: 1;
            max-width: 480px;
            margin: 0 auto;
            padding: 16px 14px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Шапка */
        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 10px rgba(124, 77, 255, 0.5);
        }

        .sound-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            min-width: 44px;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }

        .sound-btn:active {
            transform: scale(0.92);
        }

        /* Центральная зона клика */
        .core-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 8px 0 22px;
            width: 100%;
            position: relative;
        }

        .matter-orb {
            width: 190px;
            height: 190px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #9d4edd, #3c096c 65%, #10002b 100%);
            border: 3px solid rgba(199, 125, 255, 0.6);
            box-shadow: 
                0 0 35px var(--accent-glow),
                inset 0 0 25px rgba(255, 255, 255, 0.25);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            transition: transform 0.08s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.15s;
            padding: 12px;
            text-align: center;
            touch-action: manipulation;
        }

        .matter-orb.pulse {
            transform: scale(0.93);
            box-shadow: 
                0 0 55px rgba(0, 230, 118, 0.65),
                inset 0 0 35px rgba(255, 255, 255, 0.45);
        }

        .orb-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #e0aaff;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .orb-value {
            font-size: 1.85rem;
            font-weight: 900;
            line-height: 1.1;
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
            word-break: break-word;
        }

        .orb-hint {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.75);
            margin-top: 6px;
            background: rgba(0, 0, 0, 0.35);
            padding: 3px 10px;
            border-radius: 99px;
        }

        .stats-bar {
            margin-top: 16px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
        }

        .stat-pill {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 8px 16px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-sub);
        }

        .stat-pill span {
            color: var(--green);
            font-weight: 800;
        }

        /* Секция улучшений */
        .upgrades-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .section-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-sub);
            margin-bottom: 2px;
            padding-left: 4px;
        }

        .upgrade-card {
            width: 100%;
            min-height: 82px;
            border-radius: 16px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            transition: transform 0.1s, background 0.2s, border-color 0.2s, box-shadow 0.2s;
            cursor: pointer;
            touch-action: manipulation;
        }

        .upgrade-card.affordable {
            background: var(--green-bg);
            border: 2px solid var(--green-border);
            box-shadow: 0 4px 18px rgba(0, 230, 118, 0.15);
        }

        .upgrade-card.affordable:active {
            transform: scale(0.97);
        }

        .upgrade-card.locked {
            background: var(--disabled-bg);
            border: 2px solid var(--disabled-border);
            opacity: 0.6;
            filter: grayscale(40%);
            cursor: not-allowed;
        }

        .upgrade-card.maxed {
            background: rgba(124, 77, 255, 0.15);
            border: 2px solid rgba(124, 77, 255, 0.5);
            cursor: default;
        }

        .card-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .card-icon {
            font-size: 2.1rem;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            flex-shrink: 0;
        }

        .card-info {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .card-title-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
            flex-wrap: wrap;
        }

        .card-name {
            font-size: 1.1rem;
            font-weight: 800;
            color: #fff;
        }

        .card-level {
            font-size: 0.9rem;
            font-weight: 700;
            color: #c77dff;
            background: rgba(199, 125, 255, 0.15);
            padding: 2px 8px;
            border-radius: 8px;
        }

        .card-desc {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-top: 3px;
        }

        .card-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            flex-shrink: 0;
            min-width: 84px;
            min-height: 48px;
            padding: 6px 10px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.35);
            text-align: right;
        }

        .cost-label {
            font-size: 0.75rem;
            color: var(--text-sub);
            text-transform: uppercase;
        }

        .cost-value {
            font-size: 1.05rem;
            font-weight: 800;
            color: #fff;
        }

        .upgrade-card.affordable .cost-value {
            color: var(--green);
        }

        /* Нижняя панель и сброс */
        .footer-section {
            margin-top: 28px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .achievements-counter {
            font-size: 0.95rem;
            color: var(--text-sub);
        }

        .reset-btn {
            min-height: 48px;
            padding: 10px 20px;
            border-radius: 12px;
            background: rgba(255, 82, 82, 0.12);
            border: 1px solid rgba(255, 82, 82, 0.4);
            color: #ff8a80;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .reset-btn:active {
            transform: scale(0.96);
            background: rgba(255, 82, 82, 0.25);
        }

        /* Всплывающие частицы +N */
        .floating-particle {
            position: fixed;
            pointer-events: none;
            font-size: 1.35rem;
            font-weight: 900;
            color: var(--green);
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
            z-index: 100;
            animation: floatUp 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.8);
            }
            30% {
                transform: translate(-50%, -80%) scale(1.1);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -180%) scale(0.95);
            }
        }

        /* Тосты достижений */
        .toast-container {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 28px);
            max-width: 420px;
            z-index: 200;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }

        .toast {
            background: rgba(18, 12, 38, 0.95);
            border: 2px solid #ffd740;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
            border-radius: 14px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: toastInOut 3.2s ease forwards;
        }

        .toast-icon {
            font-size: 1.8rem;
        }

        .toast-text {
            display: flex;
            flex-direction: column;
        }

        .toast-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ffd740;
            font-weight: 800;
        }

        .toast-desc {
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
        }

        @keyframes toastInOut {
            0% { opacity: 0; transform: translateY(-25px) scale(0.9); }
            12% { opacity: 1; transform: translateY(0) scale(1); }
            85% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-20px) scale(0.95); }
        }

        /* Модальное окно подтверждения сброса */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.78);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 300;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: #161229;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 18px;
            padding: 22px 20px;
            max-width: 360px;
            width: 100%;
            text-align: center;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8);
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .modal-desc {
            font-size: 1rem;
            color: var(--text-sub);
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
        }

        .modal-btn {
            flex: 1;
            min-height: 48px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
        }

        .modal-btn.cancel {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        .modal-btn.confirm {
            background: var(--danger);
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="toast-container" id="toastContainer"></div>

    <div class="app-container">
        <header>
            <h1>🌌 Эволюция Материи</h1>
            <button class="sound-btn" id="soundToggle" aria-label="Звук">🔊</button>
        </header>

        <section class="core-section">
            <div class="matter-orb" id="clickOrb" role="button" aria-label="Добыть материю">
                <div class="orb-title">ДОБЫТЬ</div>
                <div class="orb-value" id="matterDisplay">0</div>
                <div class="orb-hint" id="clickPowerDisplay">+1 за тап</div>
            </div>

            <div class="stats-bar">
                <div class="stat-pill">Доход: <span id="gpsDisplay">1</span>/сек</div>
                <div class="stat-pill">Множитель: <span id="multDisplay">x1.00</span></div>
            </div>
        </section>

        <section class="upgrades-section">
            <div class="section-title">Эволюционные ветки</div>
            <div id="upgradesList"></div>
        </section>

        <footer class="footer-section">
            <div class="achievements-counter" id="achCounter">🏆 Достижения: 0 / 6</div>
            <button class="reset-btn" id="resetBtn">🗑️ Сбросить прогресс</button>
        </footer>
    </div>

    <!-- Модальное окно сброса -->
    <div class="modal-overlay" id="resetModal">
        <div class="modal-box">
            <div class="modal-title">Сбросить прогресс?</div>
            <div class="modal-desc">Вся накопленная материя, улучшения и достижения будут удалены навсегда.</div>
            <div class="modal-actions">
                <button class="modal-btn cancel" id="cancelResetBtn">Отмена</button>
                <button class="modal-btn confirm" id="confirmResetBtn">Сбросить</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            "use strict";

            // --- КОНФИГУРАЦИЯ ИГРЫ ---
            const BASE_GAIN = 1;
            const BASE_CLICK = 1;
            const SAVE_KEY = "matter_evolution_save_v1";

            const UPGRADES_CONFIG = [
                {
                    id: "earth",
                    icon: "🌍",
                    name: "Земля",
                    baseCost: 10,
                    costMult: 1.15,
                    bonus: 0.10,
                    maxLevel: 100,
                    desc: "+10% к добыче"
                },
                {
                    id: "space",
                    icon: "🚀",
                    name: "Космос",
                    baseCost: 100,
                    costMult: 1.20,
                    bonus: 0.25,
                    maxLevel: 100,
                    desc: "+25% к добыче"
                },
                {
                    id: "universe",
                    icon: "🌌",
                    name: "Вселенная",
                    baseCost: 1000,
                    costMult: 1.25,
                    bonus: 0.50,
                    maxLevel: 100,
                    desc: "+50% к добыче"
                },
                {
                    id: "multiverse",
                    icon: "♾️",
                    name: "Мультивселенная",
                    baseCost: 10000,
                    costMult: 1.30,
                    bonus: 1.00,
                    maxLevel: 100,
                    desc: "+100% к добыче"
                }
            ];

            const ACHIEVEMENTS = [
                {
                    id: "first_click",
                    icon: "✨",
                    title: "Первая материя",
                    check: (state) => state.totalClicks >= 1
                },
                {
                    id: "earth_10",
                    icon: "🌍",
                    title: "10 уровней Земли",
                    check: (state) => state.levels.earth >= 10
                },
                {
                    id: "space_unlock",
                    icon: "🚀",
                    title: "Открыл Космос",
                    check: (state) => state.levels.space >= 1
                },
                {
                    id: "universe_unlock",
                    icon: "🌌",
                    title: "Покоритель Вселенной",
                    check: (state) => state.levels.universe >= 1
                },
                {
                    id: "multiverse_unlock",
                    icon: "♾️",
                    title: "Выход в Мультивселенную",
                    check: (state) => state.levels.multiverse >= 1
                },
                {
                    id: "million_matter",
                    icon: "💎",
                    title: "Миллион материи",
                    check: (state) => state.matter >= 1000000
                }
            ];

            // --- СОСТОЯНИЕ ИГРЫ ---
            let state = getDefaultState();
            let displayedMatter = 0;
            let soundEnabled = true;
            let audioCtx = null;

            function getDefaultState() {
                return {
                    matter: 0,
                    totalClicks: 0,
                    levels: {
                        earth: 0,
                        space: 0,
                        universe: 0,
                        multiverse: 0
                    },
                    achievements: {}
                };
            }

            // --- DOM ЭЛЕМЕНТЫ ---
            const matterDisplay = document.getElementById("matterDisplay");
            const clickPowerDisplay = document.getElementById("clickPowerDisplay");
            const gpsDisplay = document.getElementById("gpsDisplay");
            const multDisplay = document.getElementById("multDisplay");
            const upgradesList = document.getElementById("upgradesList");
            const clickOrb = document.getElementById("clickOrb");
            const soundToggle = document.getElementById("soundToggle");
            const toastContainer = document.getElementById("toastContainer");
            const achCounter = document.getElementById("achCounter");
            const resetBtn = document.getElementById("resetBtn");
            const resetModal = document.getElementById("resetModal");
            const cancelResetBtn = document.getElementById("cancelResetBtn");
            const confirmResetBtn = document.getElementById("confirmResetBtn");

            // --- ФОРМАТИРОВАНИЕ ЧИСЕЛ ---
            const SUFFIXES = ["", "K", "M", "B", "T", "Qa", "Qi", "Sx", "Sp", "Oc", "No", "Dc"];

            function formatNumber(num, forceDecimals = false) {
                if (!isFinite(num) || num < 0) return "0";
                if (num < 1000) {
                    if (forceDecimals && num % 1 !== 0) {
                        return num.toFixed(1);
                    }
                    return Math.floor(num).toString();
                }
                const tier = Math.floor(Math.log10(Math.abs(num)) / 3);
                if (tier === 0) return Math.floor(num).toString();
                const suffix = SUFFIXES[tier] || ("e" + (tier * 3));
                const scale = Math.pow(10, tier * 3);
                const scaled = num / scale;
                const formatted = scaled < 10 ? scaled.toFixed(2) : scaled.toFixed(1);
                return formatted.replace(/\.0+$/, "") + suffix;
            }

            // --- МАТЕМАТИКА ИГРЫ ---
            function getMultiplier() {
                let bonusSum = 0;
                for (let i = 0; i < UPGRADES_CONFIG.length; i++) {
                    const upg = UPGRADES_CONFIG[i];
                    const lvl = state.levels[upg.id] || 0;
                    bonusSum += lvl * upg.bonus;
                }
                return 1 + bonusSum;
            }

            function getGainPerSec() {
                return BASE_GAIN * getMultiplier();
            }

            function getGainPerClick() {
                return BASE_CLICK * getMultiplier();
            }

            function getUpgradeCost(upg) {
                const lvl = state.levels[upg.id] || 0;
                return Math.floor(upg.baseCost * Math.pow(upg.costMult, lvl));
            }

            // --- WEB AUDIO API & ВИБРАЦИЯ ---
            function playBeep(freq = 520, duration = 0.055, type = "sine") {
                if (!soundEnabled) return;
                try {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    if (!AudioContextClass) return;
                    if (!audioCtx) {
                        audioCtx = new AudioContextClass();
                    }
                    if (audioCtx.state === "suspended") {
                        audioCtx.resume();
                    }
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + duration);
                } catch (e) {
                    // Игнорируем блокировку автовоспроизведения
                }
            }

            function vibrate(ms) {
                try {
                    if (navigator.vibrate) {
                        navigator.vibrate(ms);
                    }
                } catch (e) {}
            }

            // --- РЕНДЕР КАРТОЧЕК УЛУЧШЕНИЙ ---
            function initUpgradesDOM() {
                upgradesList.innerHTML = "";
                UPGRADES_CONFIG.forEach((upg) => {
                    const card = document.createElement("div");
                    card.className = "upgrade-card locked";
                    card.id = "card_" + upg.id;

                    card.innerHTML = `
                        <div class="card-left">
                            <div class="card-icon">${upg.icon}</div>
                            <div class="card-info">
                                <div class="card-title-row">
                                    <span class="card-name">${upg.name}</span>
                                    <span class="card-level" id="lvl_${upg.id}">Ур. 0/${upg.maxLevel}</span>
                                </div>
                                <div class="card-desc">${upg.desc}</div>
                            </div>
                        </div>
                        <div class="card-right">
                            <span class="cost-label" id="costLabel_${upg.id}">Цена</span>
                            <span class="cost-value" id="cost_${upg.id}">0</span>
                        </div>
                    `;

                    card.addEventListener("pointerdown", (e) => {
                        e.preventDefault();
                        buyUpgrade(upg.id);
                    });

                    upgradesList.appendChild(card);
                });
            }

            function updateUI() {
                const mult = getMultiplier();
                const gps = getGainPerSec();
                const gpc = getGainPerClick();

                clickPowerDisplay.textContent = "+" + formatNumber(gpc, true) + " за тап";
                gpsDisplay.textContent = formatNumber(gps, true);
                multDisplay.textContent = "x" + mult.toFixed(2);

                UPGRADES_CONFIG.forEach((upg) => {
                    const lvl = state.levels[upg.id] || 0;
                    const cost = getUpgradeCost(upg);
                    const isMax = lvl >= upg.maxLevel;
                    const canAfford = !isMax && state.matter >= cost;

                    const card = document.getElementById("card_" + upg.id);
                    const lvlEl = document.getElementById("lvl_" + upg.id);
                    const costEl = document.getElementById("cost_" + upg.id);
                    const costLabelEl = document.getElementById("costLabel_" + upg.id);

                    lvlEl.textContent = `Ур. ${lvl}/${upg.maxLevel}`;

                    if (isMax) {
                        card.className = "upgrade-card maxed";
                        costLabelEl.textContent = "Статус";
                        costEl.textContent = "МАКС";
                    } else {
                        card.className = "upgrade-card " + (canAfford ? "affordable" : "locked");
                        costLabelEl.textContent = "Цена";
                        costEl.textContent = formatNumber(cost);
                    }
                });

                const unlockedCount = Object.keys(state.achievements).length;
                achCounter.textContent = `🏆 Достижения: ${unlockedCount} / ${ACHIEVEMENTS.length}`;
            }

            // --- ИГРОВЫЕ ДЕЙСТВИЯ ---
            function handleOrbTap(clientX, clientY) {
                const gain = getGainPerClick();
                state.matter += gain;
                state.totalClicks += 1;

                // Пульсация кнопки
                clickOrb.classList.remove("pulse");
                void clickOrb.offsetWidth;
                clickOrb.classList.add("pulse");
                setTimeout(() => clickOrb.classList.remove("pulse"), 90);

                // Звук и вибрация
                playBeep(560, 0.045, "triangle");
                vibrate(12);

                // Частица
                spawnParticle(clientX, clientY, "+" + formatNumber(gain, true));

                checkAchievements();
                updateUI();
            }

            function buyUpgrade(upgId) {
                const upg = UPGRADES_CONFIG.find(u => u.id === upgId);
                if (!upg) return;

                const lvl = state.levels[upg.id] || 0;
                if (lvl >= upg.maxLevel) return;

                const cost = getUpgradeCost(upg);
                if (state.matter < cost) {
                    playBeep(180, 0.06, "sawtooth");
                    return;
                }

                state.matter -= cost;
                state.levels[upg.id] = lvl + 1;

                playBeep(740, 0.08, "sine");
                setTimeout(() => playBeep(980, 0.09, "sine"), 50);
                vibrate([20, 30, 20]);

                checkAchievements();
                updateUI();
                saveProgress();
            }

            function spawnParticle(x, y, text) {
                const rect = clickOrb.getBoundingClientRect();
                const posX = (x && x > 0) ? x : (rect.left + rect.width / 2 + (Math.random() * 40 - 20));
                const posY = (y && y > 0) ? y : (rect.top + rect.height / 2 + (Math.random() * 40 - 20));

                const el = document.createElement("div");
                el.className = "floating-particle";
                el.textContent = text;
                el.style.left = posX + "px";
                el.style.top = posY + "px";

                document.body.appendChild(el);
                setTimeout(() => {
                    if (el.parentNode) el.parentNode.removeChild(el);
                }, 850);
            }

            // --- ДОСТИЖЕНИЯ ---
            function checkAchievements() {
                ACHIEVEMENTS.forEach((ach) => {
                    if (!state.achievements[ach.id] && ach.check(state)) {
                        state.achievements[ach.id] = true;
                        showAchievementToast(ach);
                    }
                });
            }

            function showAchievementToast(ach) {
                const toast = document.createElement("div");
                toast.className = "toast";
                toast.innerHTML = `
                    <div class="toast-icon">${ach.icon}</div>
                    <div class="toast-text">
                        <span class="toast-title">Достижение открыто!</span>
                        <span class="toast-desc">${ach.title}</span>
                    </div>
                `;
                toastContainer.appendChild(toast);
                playBeep(880, 0.12, "triangle");
                setTimeout(() => {
                    if (toast.parentNode) toast.parentNode.removeChild(toast);
                }, 3200);
            }

            // --- СОХРАНЕНИЕ И ЗАГРУЗКА ---
            function saveProgress() {
                try {
                    localStorage.setItem(SAVE_KEY, JSON.stringify(state));
                } catch (e) {}
            }

            function loadProgress() {
                try {
                    const raw = localStorage.getItem(SAVE_KEY);
                    if (!raw) return;
                    const parsed = JSON.parse(raw);
                    if (parsed && typeof parsed === "object") {
                        state.matter = Number(parsed.matter) || 0;
                        state.totalClicks = Number(parsed.totalClicks) || 0;
                        if (parsed.levels && typeof parsed.levels === "object") {
                            UPGRADES_CONFIG.forEach(u => {
                                const savedLvl = parseInt(parsed.levels[u.id], 10);
                                state.levels[u.id] = isNaN(savedLvl) ? 0 : Math.min(Math.max(0, savedLvl), u.maxLevel);
                            });
                        }
                        if (parsed.achievements && typeof parsed.achievements === "object") {
                            state.achievements = parsed.achievements;
                        }
                    }
                } catch (e) {}
                displayedMatter = state.matter;
            }

            function resetProgress() {
                state = getDefaultState();
                displayedMatter = 0;
                try {
                    localStorage.removeItem(SAVE_KEY);
                } catch (e) {}
                updateUI();
                matterDisplay.textContent = "0";
            }

            // --- ОБРАБОТЧИКИ СОБЫТИЙ ---
            clickOrb.addEventListener("pointerdown", (e) => {
                e.preventDefault();
                handleOrbTap(e.clientX, e.clientY);
            });

            soundToggle.addEventListener("pointerdown", (e) => {
                e.preventDefault();
                soundEnabled = !soundEnabled;
                soundToggle.textContent = soundEnabled ? "🔊" : "🔇";
                if (soundEnabled) playBeep(600, 0.05);
            });

            resetBtn.addEventListener("pointerdown", (e) => {
                e.preventDefault();
                resetModal.classList.add("active");
            });

            cancelResetBtn.addEventListener("pointerdown", (e) => {
                e.preventDefault();
                resetModal.classList.remove("active");
            });

            confirmResetBtn.addEventListener("pointerdown", (e) => {
                e.preventDefault();
                resetModal.classList.remove("active");
                resetProgress();
                vibrate(40);
            });

            window.addEventListener("beforeunload", saveProgress);
            document.addEventListener("visibilitychange", () => {
                if (document.visibilityState === "hidden") {
                    saveProgress();
                }
            });

            // --- ИГРОВОЙ ЦИКЛ ---
            // Пассивный доход 10 раз в секунду (каждые 100 мс)
            let lastTick = performance.now();
            setInterval(() => {
                const now = performance.now();
                const dt = (now - lastTick) / 1000;
                lastTick = now;

                const gain = getGainPerSec() * dt;
                state.matter += gain;

                checkAchievements();
                updateUI();
            }, 100);

            // Плавная анимация счетчика материи (60 FPS)
            function animateMatterCounter() {
                const diff = state.matter - displayedMatter;
                if (Math.abs(diff) > 0.05) {
                    displayedMatter += diff * 0.25;
                } else {
                    displayedMatter = state.matter;
                }
                matterDisplay.textContent = formatNumber(displayedMatter);
                requestAnimationFrame(animateMatterCounter);
            }

            // Автосохранение каждые 5 секунд
            setInterval(saveProgress, 5000);

            // --- СТАРТ ИГРЫ ---
            initUpgradesDOM();
            loadProgress();
            updateUI();
            requestAnimationFrame(animateMatterCounter);
        })();
    </script>
</body>
</html>
